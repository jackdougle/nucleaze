[package]
name = "nucleaze"
version = "1.4.2"
edition = "2024"
description = "Read filtering using k-mers."
license = "MIT"
repository = "https://github.com/jackdougle/nucleaze"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
needletail = "0.6.3"
rayon = "1.11.0"
rustc-hash = "2.1.1"
bincode = "2.0.1"
num_cpus = "1.17.0"
sysinfo = "0.38.2"
libc = "0.2.182"
tempfile = "3.26.0"
rand = "0.10.0"
predicates = "3.1.4"
assert_cmd = "2.1.2"
rlimit = "0.11.0"
crossbeam = "0.8.4"
